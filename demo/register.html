
<!DOCTYPE html>
<html>
<head>
    <title>Детская игра Пазл - Регистрация</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="static/style.css">
  <script src="demo-api.js"></script>
</head>
<body>
    <div class="container">
        <h1>Создание аккаунта</h1>
        
        
        
        <form action="#" data-demo="register" method="post">
            <div class="form-group">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="button-group">
                <button type="submit" class="primary-button">Зарегистрироваться</button>
                <a href="index.html" class="secondary-button">Назад ко входу</a>
            </div>
        </form>
    </div>
</body>
</html>
