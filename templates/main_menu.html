
<!DOCTYPE html>
<html>
<head>
    <title>Детская игра Пазл - Главное меню</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Добро пожаловать, {{ username }}!</h1>
        
        <div class="menu-buttons">
            <a href="{{ url_for('difficulty') }}" class="menu-button">Играть в пазл</a>
            <a href="{{ url_for('achievements') }}" class="menu-button">Достижения</a>
            <button id="delete-account" class="menu-button delete-button">Удалить аккаунт</button>
            <a href="{{ url_for('logout') }}" class="menu-button">Выйти</a>
        </div>
    </div>
    
    <script>
        document.getElementById('delete-account').addEventListener('click', function() {
            if(confirm('Вы уверены, что хотите удалить свой аккаунт? Это действие нельзя отменить.')) {
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '{{ url_for("delete_account") }}';
                document.body.appendChild(form);
                form.submit();
            }
        });
    </script>
</body>
</html>
